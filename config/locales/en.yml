      how_title: "What is FTP, and how is it estimated?"
      what_body: "It's the power you can hold for about an hour without blowing up — your line between \"I can keep this going\" and \"my legs are on fire\". Just below it you last for hours; just above it you last a few minutes. It's your reference value: it's what we use to rate how hard each of your rides was and to work out your training load."
      how_body: "No test needed: the app looks at your last six weeks and picks out your best efforts (around 5, 10 and 20 minutes). From those it works out the power you could hold for an hour, and keeps the most favourable estimate. One short but genuinely all-out effort is enough — the more you do, the more accurate it gets. If you've done a real test, you can also enter your value by hand."
      set_weight_hint: "Set your weight for W/kg"
      edit: "Edit"
      manual_label: "Manual FTP (official test)"
      auto_placeholder: "auto"
      weight_label: "Weight"
      save: "Save"
      use_auto: "Back to auto"
      cancel: "Cancel"
      manual_since: "Manually set since %{date}"
      history_title: "FTP trend (6-week rolling window)"
      based_on: "Key efforts"
