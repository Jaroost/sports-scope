    lthr:
      title: "HR threshold & progression"
      no_estimate: "No ride with heart rate yet to estimate your HR threshold."
      no_hr_hint: "No ride with a heart-rate strap: the HR threshold cannot be estimated."
      auto_detail: "Automatic estimate"
