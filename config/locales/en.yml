    glossary:
      title: "Glossary: every acronym in plain words"
      ftp_term: "FTP — threshold power"
      ftp_def: "The power (in watts) you can hold for about an hour without blowing up. It's your reference: everything else is worked out from it."
      lthr_term: "HR threshold (LTHR)"
      lthr_def: "Same idea, but in heartbeats: the highest heart rate you can hold for about an hour. Used as your reference when you have no power meter."
      tss_term: "TSS — load of a session"
      tss_def: "A fatigue score per session, combining duration and intensity. Landmark: 100 = exactly one hour at your threshold. Two easy hours and one hard hour can score the same."
      if_term: "IF — intensity"
      if_def: "How hard a session was compared to your threshold. 1.0 = right at your threshold, 0.7 = endurance ride, above 1.0 = harder than your threshold."
      np_term: "NP — normalised power"
      np_def: "A power average that penalises surges. A stop-start ride tires you more than a steady one at the same average: NP reflects that, a plain average doesn't."
      ctl_term: "Fitness (CTL)"
      ctl_def: "Your average training load over the last 6 weeks. It climbs slowly when you train regularly — that's your progression."
      atl_term: "Fatigue (ATL)"
      atl_def: "The same average, but over 7 days. It spikes fast after a big block and drops fast when you rest."
      tsb_term: "Freshness (TSB)"
      tsb_def: "Fitness minus fatigue. Positive = rested and ready to perform; negative = you're absorbing load (normal mid-block)."
      acwr_term: "Load ratio (ACWR)"
      acwr_def: "Your load over the last 7 days compared to the last 28. Between 0.8 and 1.3 you progress without overloading; above 1.5 you're ramping too fast and injury risk goes up."
      wkg_term: "W/kg — watts per kilo"
      wkg_def: "Your power divided by your weight. That's what counts uphill: at equal watts, the lighter rider climbs faster."
