      method_60min: "From an effort of about 1 h"
      samples: "over %{count} rides with heart rate"
      max_hr: "Max HR seen"
      how_title: "What is the HR threshold, and how is it estimated?"
      what_body: "It's the highest heart rate you can hold in a steady state for about an hour — the heart-rate equivalent of FTP. Below it, your body clears lactate as fast as it produces it; above it, lactate builds up and you fade within minutes. It's what rates the intensity of your rides when you have no power meter, and what sets your heart-rate zones."
      how_body: "No test needed: the app looks at your rides over the last six weeks and keeps the average HR of your best ~1 h effort, or your best 20 min minus 2%. It keeps the higher of the two — each is a floor of what you held. The two may come from two different rides. If you've done a real test (30 min solo all-out, average of the LAST 20 minutes), enter it by hand: it takes precedence."
