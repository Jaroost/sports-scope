      calc_label: "How it's calculated"
      tss_calc: "duration (h) × IF (intensity factor)² × 100"
      if_calc: "NP (normalized power) ÷ FTP (threshold power)"
      np_calc: "30 s rolling average of power, raised to the 4th, averaged, 4th root"
      vi_calc: "NP (normalized power) ÷ average power"
      decoupling_calc_power: "efficiency = NP (normalized power) ÷ HR (heart rate), first vs second half"
      decoupling_calc_pace: "efficiency = speed ÷ HR (heart rate), first vs second half"
