      tss: "Training load (TSS)"
      tss_hint: "<strong>Training load</strong> — how much this session tired you, boiled down to one number.<br>A longer <strong>or</strong> harder outing pushes the score up.<br>Rule of thumb: 100 ≈ one hour all-out; an easy hour is more like 40 to 60."
      if_label: "IF"
      if_hint: "<strong>Effort intensity</strong> — how close you stayed to the hardest pace you can hold for a long time.<br>~0.75 = easy (endurance) · 1.0 = all-out, your threshold · above = very hard, not sustainable for long."
      np: "Normalized power (NP)"
      np_hint: "<strong>Felt power</strong> — the watts that reflect how hard the effort really was, not just the average.<br>Surges (accelerations, climbs) cost the body a lot: the plain average hides them, this measure counts them.<br>Steady ride: almost the same as average power · surgy ride: clearly higher.<br><small>Under the hood: the hard moments are raised to the 4th power before averaging — that's what penalises the surges.</small>"
      vi: "Variability index (VI)"
      vi_hint: "<strong>How even the effort was</strong> — smooth pacing, or lots of surges?<br>Rough guide by ride type:<ul><li>1.00–1.05: very steady (time trial, indoor trainer)</li><li>1.05–1.15: flowing road, few descents</li><li>1.2–1.4: long hilly ride (descents, villages, re-accelerations)</li><li>1.25–1.5: group ride, stop-and-go, MTB</li></ul>A high number comes mostly from coasting and stops (0 W), not necessarily a hard effort."
      decoupling: "Aerobic decoupling"
      decoupling_hint_power: "<strong>Holding the effort</strong> — in the second half, did your heart climb for the same effort?<br>Under 5% = good endurance, you held well · much more = you tired (or heat, dehydration)."
      decoupling_hint_pace: "<strong>Holding the effort</strong> — in the second half, did your heart climb for the same pace?<br>Under 5% = good endurance, you held well · much more = you tired (or heat, dehydration)."
