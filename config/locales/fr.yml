      title: "Lexique : tous les sigles en clair"
      ftp_term: "FTP — puissance seuil"
      ftp_def: "La puissance (en watts) que tu peux tenir environ une heure sans exploser. C'est ta référence : tout le reste se calcule par rapport à elle."
      lthr_term: "Seuil FC (LTHR)"
      lthr_def: "La même idée, mais en pulsations : la fréquence cardiaque la plus haute que tu peux tenir environ une heure. Sert de référence quand tu n'as pas de capteur de puissance."
      tss_term: "TSS — charge d'une sortie"
      tss_def: "Un score de fatigue par séance : il combine la durée et l'intensité. Repère : 100 = une heure pile à ton seuil. Deux heures tranquilles ou une heure dure peuvent donner le même chiffre."
      if_term: "IF — intensité"
      if_def: "À quel point une sortie était dure par rapport à ton seuil. 1,0 = pile à ton seuil, 0,7 = sortie d'endurance, au-dessus de 1,0 = plus dur que ton seuil."
      np_term: "NP — puissance normalisée"
      np_def: "Une moyenne de puissance qui pénalise les à-coups. Une sortie en dents de scie fatigue plus qu'une sortie régulière à la même moyenne : la NP le reflète, la moyenne simple non."
      ctl_term: "Forme de fond (CTL)"
      ctl_def: "Ta charge d'entraînement moyenne des 6 dernières semaines. Elle monte lentement quand tu t'entraînes régulièrement — c'est ta progression."
      atl_term: "Fatigue (ATL)"
      atl_def: "La même moyenne, mais sur 7 jours. Elle grimpe vite après un gros bloc et redescend vite au repos."
      tsb_term: "Fraîcheur (TSB)"
      tsb_def: "Forme de fond moins fatigue. Positif = tu es reposé et prêt à performer ; négatif = tu encaisses (normal en plein bloc d'entraînement)."
      acwr_term: "Ratio de charge (ACWR)"
      acwr_def: "Ta charge des 7 derniers jours comparée à celle des 28 derniers. Entre 0,8 et 1,3 tu progresses sans surcharge ; au-dessus de 1,5 tu montes trop vite et le risque de blessure augmente."
      wkg_term: "W/kg — watts par kilo"
      wkg_def: "Ta puissance divisée par ton poids. C'est ce qui compte en montée : à watts égaux, le plus léger monte plus vite."
