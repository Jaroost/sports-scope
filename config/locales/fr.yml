      how_title: "Qu'est-ce que le seuil FC, et comment est-il estimé ?"
      what_body: "C'est la fréquence cardiaque la plus haute que tu peux tenir en régime stable, environ une heure — l'équivalent cardiaque de la FTP. En dessous, ton corps évacue le lactate aussi vite qu'il le produit ; au-dessus, il s'accumule et tu craques en quelques minutes. C'est lui qui situe l'intensité de tes sorties sans capteur de puissance, et qui découpe tes zones cardio."
      how_body: "Pas besoin de test : l'appli regarde tes sorties vélo des six dernières semaines et garde la FC moyenne de ton meilleur effort d'environ une heure, ou celle de ton meilleur 20 min abattue de 2 %. Elle retient la plus haute des deux — chacune est un plancher de ce que tu as tenu. Les deux peuvent venir de deux sorties différentes. Si tu as fait un vrai test (30 min à fond en solo, moyenne des 20 DERNIÈRES minutes), saisis-le à la main : il primera."
