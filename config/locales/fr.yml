      cp_short: "modèle"
      samples: "sur %{count} sorties avec puissance"
      how_title: "Qu'est-ce que la FTP, et comment est-elle estimée ?"
      what_body: "C'est la puissance que tu peux tenir environ une heure sans exploser — ta limite entre « ça passe longtemps » et « ça brûle ». Juste en dessous, tu tiens des heures ; juste au-dessus, tu ne tiens plus que quelques minutes. C'est ta valeur de référence : c'est elle qui sert à situer l'intensité de chacune de tes sorties et à calculer ta charge d'entraînement."
      how_body: "Pas besoin de faire un test : l'appli regarde tes six dernières semaines et repère tes meilleurs efforts (environ 5, 10 et 20 minutes). Elle en déduit la puissance que tu tiendrais sur une heure et retient l'estimation la plus favorable. Un effort court mais vraiment à fond suffit — plus tu en fais, plus l'estimation est juste. Si tu as passé un vrai test, tu peux aussi saisir ta valeur à la main."
